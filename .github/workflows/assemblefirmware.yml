# This is a basic workflow to help you get started with Actions

name: Weimarnetz Package Build

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  workflow_dispatch:
  push:
    branches: [ brauhaus-19.07 ]
    #paths:
    #  - 'assemble/**'
    #  - 'build/**'
    #  - 'net/**'
    #  - 'utils/**'
    #  - '.github/**'
  pull_request:
    branches: [ brauhaus-19.07 ]
    paths:
      - 'assemble/**'
      - 'build/**'
      - 'net/**'
      - 'utils/**'


permissions:
  contents: read
  actions: write # Für repository_dispatch

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  compile_packages:
    strategy:
      matrix:
        target: [ath79_generic] #, mpc85xx_p1010, ramips_mt7620, ramips_mt7621, ramips_mt76x8, x86_generic, x86_64, ipq40xx_generic]
        include:
        - openwrt: 23.05.5
      fail-fast: false
    runs-on: ubuntu-24.04

    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4
    - run: |
        git fetch --prune --unshallow
    
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E add-apt-repository -y universe
        # TODO: default apt config doesn't load repositories. Check later if that's still a problem
        sudo tee /etc/apt/sources.list <<EOF
        deb http://archive.ubuntu.com/ubuntu noble main universe restricted multiverse
        deb http://archive.ubuntu.com/ubuntu noble-updates main universe restricted multiverse
        deb http://archive.ubuntu.com/ubuntu noble-security main universe restricted multiverse
        EOF
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Build po2lmo
      run: |
        git clone https://github.com/weimarnetz/po2lmo
        cd po2lmo
        make
        sudo make install

    - name: compile packages for target ${{ matrix.target }} 
      env:
        PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_PRIVATE_KEY }}
      run: |
        cd assemble
        echo "$PACKAGE_SIGNING_KEY" > keys/key-build
        ./compile_packages.sh -t ${{ matrix.target }} -o ${{ matrix.openwrt }}

    - name: upload packages directory
      if: github.event_name == 'push'
      env:
        SSH_KEY: ${{ secrets.BUILDBOT_PRIVATE_KEY }}
      run: |
        eval "$(ssh-agent -s)"
        ssh-add - <<< "${SSH_KEY}"
        version="$(git describe --always --dirty --tags)"
        cd assemble
        if [ -d "packages_weimar/" ]; then
          target="$(echo ${{ matrix.target }}|tr '_' /)"
          mkdir -p packages_weimar/packages/$target
          find ./packages_weimar -maxdepth 1 -type f -exec mv {} packages_weimar/packages/$target \;
          rsync -avz --delete --relative '-e ssh -o StrictHostKeyChecking=no -p22223' packages_weimar/packages/./$target/ buildbot@buildbot.weimarnetz.de:/brauhaus/packages/
        fi

  # Separate job that runs after all matrix jobs are completed
  trigger_firmware_build:
    # needs: compile_packages
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: weimarnetz
          permission-contents: write
          permission-actions: write
          repositories: |
            imagebuilder
            packages
        
      - name: Trigger firmware build
        run: |
          curl -X POST \
          -H "Authorization: token ${{ steps.app-token.outputs.token }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/weimarnetz/imagebuilder/dispatches \
          -d '{"event_type": "package_update", "client_payload": {"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}}'

      - name: Debug token
        run: |
          echo "Token exists: ${{ steps.app-token.outputs.token != '' }}"
          echo "Token length: ${#TOKEN}"
          echo "Token starts with: ${TOKEN:0:5}..."
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Test token permissions
        run: |
          curl -s -H "Authorization: token ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/weimarnetz/imagebuilder

      - name: Test admin permissions ib
        run: |
          curl -s -H "Authorization: token ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/weimarnetz/imagebuilder | jq .permissions
      - name: Test admin permissions packages
        run: |
          curl -s -H "Authorization: token ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/weimarnetz/packages | jq .permissions
    